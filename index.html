
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in / Twitter</title>
    <link rel="stylesheet" href="signin.css">
</head>
<body>

<div class="card">

    <svg class="logo" viewBox="0 0 24 24" aria-label="Twitter">
        <path fill="currentColor" d="M23.95 4.57a10 10 0 0 1-2.83.78 4.93 4.93 0 0 0 2.16-2.72 9.99 9.99 0 0 1-3.13 1.2 4.92 4.92 0 0 0-8.38 4.48A13.97 13.97 0 0 1 1.64 3.16a4.92 4.92 0 0 0 1.52 6.57 4.9 4.9 0 0 1-2.23-.62v.06a4.92 4.92 0 0 0 3.95 4.82 4.94 4.94 0 0 1-2.22.09 4.93 4.93 0 0 0 4.6 3.42A9.87 9.87 0 0 1 0 19.53a13.94 13.94 0 0 0 7.55 2.21c9.05 0 14-7.5 14-14l-.02-.64a10.01 10.01 0 0 0 2.42-2.54Z"/>
    </svg>

    <h1 id="title">Sign in to Twitter</h1>

    <p class="sub" id="subtitle">
        Welcome back. Enter your details below.
    </p>

    <form id="authForm" novalidate>

        <label id="nameField" style="display:none">
            Name
            <input type="text" id="name" placeholder="Your full name">
        </label>

        <label>
            Email
            <input type="email" id="email" placeholder="you@example.com">
        </label>

        <label>
            Password
            <input type="password" id="password" placeholder="At least 6 characters">
        </label>

        <p class="error" id="error"></p>

        <p class="notice" id="notice"></p>

        <button type="submit" id="submitBtn">Sign in</button>

    </form>

    <p class="switch">
        <span id="switchText">Don't have an account?</span>
        <button type="button" id="switchBtn">Sign up</button>
    </p>

</div>

<script src="signin.js"></script>

</body>
</html>
